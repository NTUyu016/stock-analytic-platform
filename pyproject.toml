[project]
name = "stock-analytic-platform"
version = "0.1.0"
description = "個人台股持股儀表板 v1"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "yfinance>=0.2.48",
    "authlib>=1.3",
    "itsdangerous>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "freezegun>=1.5",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/api", "src/quote_worker"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
# 120 而非常見的 88/100：註解大量是中文（本專案的寫作規則要求附「為什麼」），
# CJK 字元資訊密度高，逐行硬折會犧牲可讀性換取一個任意的字數上限。
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
